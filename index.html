<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Megaswap | Studio Web3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background-color: #0F172A; color: #F1F5F9; font-family: 'Syne', sans-serif; overflow-x: hidden; touch-action: manipulation; }
        .mono { font-family: 'DM Mono', monospace; }
        .glass-panel { background: #1E293B; border: 1px solid #334155; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        .flip-anim { transition: transform 0.3s ease; }
        .flipped { transform: rotate(180deg); }
        .tab-active { color: #38BDF8; border-bottom: 2px solid #38BDF8; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 relative">

    <nav class="absolute top-0 left-0 w-full p-4 md:p-6 flex justify-between items-center z-40 bg-slate-900/50 backdrop-blur-md border-b border-slate-800">
        <div class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 flex items-center gap-2">
            🚀 Studio Web3
        </div>
        <div class="flex items-center gap-2">
            <span id="network-badge" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full px-3 py-1 text-xs font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> <span id="network-badge-text">Base Mainnet</span>
            </span>
        </div>
    </nav>

    <div class="w-full max-w-md mt-16">
        <div class="flex border-b border-slate-700 mb-4 justify-center gap-8 text-sm font-bold tracking-wider uppercase">
            <button id="tab-swap" class="tab-active pb-2 px-4 transition duration-200 hover:text-sky-400">🔄 Swap</button>
            <button id="tab-bridge" class="text-slate-400 pb-2 px-4 transition duration-200 hover:text-sky-400">🌉 Bridge</button>
        </div>

        <div class="glass-panel p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-32 bg-sky-600 rounded-full blur-[60px] opacity-20 pointer-events-none"></div>

            <div class="flex justify-between items-center mb-6">
                <h1 id="panel-title" class="text-2xl font-bold text-white">Megaswap</h1>
                <div class="flex gap-2">
                    <button id="disconnect-btn" class="hidden text-xs text-sky-400 hover:text-sky-300 hover:border-sky-400/50 transition duration-200 px-3 py-2 bg-slate-900/60 rounded-xl border border-sky-500/30 flex items-center gap-1 shadow-md shadow-sky-950/20">
                        <span>🔌</span> <span class="font-medium tracking-wide">Disconnect</span>
                    </button>
                    <button class="text-slate-400 hover:text-white transition p-2 bg-slate-800 rounded-xl border border-slate-700">⚙️</button>
                </div>
            </div>

            <div id="bridge-dest-box" class="hidden bg-slate-900 border border-indigo-500/30 rounded-2xl p-4 mb-4">
                <span class="text-xs text-indigo-400 uppercase tracking-widest font-bold block mb-2">Destination Network</span>
                <select id="bridge-network-select" class="bg-slate-800 text-white font-bold rounded-xl p-2 w-full border border-slate-700 outline-none focus:border-indigo-500">
                    <option value="sepolia">Ethereum Sepolia</option>
                    <option value="base-testnet">Base Sepolia</option>
                    <option value="arbitrum-testnet">Arbitrum Sepolia</option>
                </select>
            </div>

            <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 mb-2 focus-within:border-sky-500/50 transition">
                <div class="flex justify-between mb-2">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">You pay</span>
                    <span class="text-xs text-slate-400 mono">Balance: <span id="top-balance">0.00</span></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <input type="number" id="top-input" placeholder="0.0" class="bg-transparent text-3xl font-bold text-white w-full outline-none" />
                    <div class="flex items-center gap-2 bg-slate-800 rounded-xl px-4 py-2 border border-slate-600 shrink-0 min-w-[110px] justify-center">
                        <span id="top-icon" class="text-xl"><img src="https://assets.coingecko.com/coins/images/279/small/ethereum.png" class="w-6 h-6 rounded-full inline" alt="ETH"></span>
                        <span id="top-symbol" class="font-bold text-white">ETH</span>
                    </div>
                </div>
            </div>

            <div id="flip-container" class="flex justify-center -my-5 relative z-10">
                <div id="btn-flip" class="bg-slate-800 border-4 border-[#1E293B] rounded-xl p-2 text-sky-400 hover:bg-slate-700 transition cursor-pointer flip-anim shadow-lg">
                    ⬇️
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 mb-6 mt-2">
                <div class="flex justify-between mb-2">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">You receive</span>
                    <span class="text-xs text-slate-400 mono">Balance: <span id="bottom-balance">0.00</span></span>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <input type="text" id="bottom-output" placeholder="0.0" readonly class="bg-transparent text-3xl font-bold text-emerald-400 w-full outline-none cursor-not-allowed" />
                    <div class="flex items-center gap-2 bg-slate-800 rounded-xl px-4 py-2 border border-slate-600 shrink-0 min-w-[110px] justify-center">
                        <span id="bottom-icon" class="text-xl">🚀</span>
                        <span id="bottom-symbol" class="font-bold text-white">BPUMP</span>
                    </div>
                </div>
            </div>

            <div id="tx-details" class="hidden flex-col gap-2 mb-6 px-2 text-xs mono text-slate-400">
                <div class="flex justify-between">
                    <span>Exchange Rate</span>
                    <span id="rate-display">Withdrawing...</span>
                </div>
                <div id="slippage-box" class="flex justify-between">
                    <span>Max Slippage</span>
                    <span class="text-sky-400">5.00%</span>
                </div>
            </div>

            <button id="action-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold py-4 px-4 rounded-xl transition shadow-lg shadow-sky-500/20 text-lg uppercase tracking-wider">
                Connect Wallet
            </button>
            <p id="status-msg" class="text-center mono text-xs text-sky-400 mt-4 h-4"></p>
        </div>
        
        <p id="powered-footer" class="text-center text-slate-500 text-xs mt-6 mono">Powered by Aerodrome Liquidity • 0x17...cAd6</p>
    </div>

    <script>
        // === CONFIGURATIONS RÉSEAUX ===
        const CHAIN_BASE_MAINNET = '0x2105'; 
        const CHAIN_ARC_TESTNET = '0x4cef52'; // ID Officiel pour Arc Testnet (5042002)

        // Adresses Base Mainnet
        const BPUMP_ADDRESS = '0x1763c231662d7dc4be28fc169d1056bdcce8cad6';
        const WETH_ADDRESS = '0x4200000000000000000000000000000000000006'; 
        const AERO_ROUTER = '0xcf77a3ba9a5ca399b7c97c74d54e5b1beb874e43';
        const AERO_FACTORY = '0x420dd381b31aef6683db6b902084cb0ffece40da';

        // Constantes Jetons ARC Testnet
        const ARC_USDC_ADDRESS = '0x3600000000000000000000000000000000000000'; 

        // ABIs
        const erc20ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function allowance(address owner, address spender) view returns (uint256)",
            "function approve(address spender, uint256 amount) returns (bool)"
        ];
        const routerABI = [
            "function getAmountsOut(uint256 amountIn, tuple(address from, address to, bool stable, address factory)[] routes) view returns (uint256[] amounts)",
            "function swapExactETHForTokens(uint amountOutMin, tuple(address from, address to, bool stable, address factory)[] routes, address to, uint deadline) payable returns (uint[] amounts)",
            "function swapExactTokensForETH(uint amountIn, uint amountOutMin, tuple(address from, address to, bool stable, address factory)[] routes, address to, uint deadline) returns (uint[] amounts)"
        ];

        // === DOM ELEMENTS ===
        const tabSwap = document.getElementById('tab-swap');
        const tabBridge = document.getElementById('tab-bridge');
        const panelTitle = document.getElementById('panel-title');
        const networkBadge = document.getElementById('network-badge');
        const networkBadgeText = document.getElementById('network-badge-text');
        const bridgeDestBox = document.getElementById('bridge-dest-box');
        const flipContainer = document.getElementById('flip-container');
        const poweredFooter = document.getElementById('powered-footer');
        const slippageBox = document.getElementById('slippage-box');

        const actionBtn = document.getElementById('action-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const statusMsg = document.getElementById('status-msg');
        const topInput = document.getElementById('top-input');
        const bottomOutput = document.getElementById('bottom-output');
        const topBalanceDisplay = document.getElementById('top-balance');
        const bottomBalanceDisplay = document.getElementById('bottom-balance');
        const txDetails = document.getElementById('tx-details');
        const rateDisplay = document.getElementById('rate-display');
        
        const btnFlip = document.getElementById('btn-flip');
        const topIcon = document.getElementById('top-icon');
        const topSymbol = document.getElementById('top-symbol');
        const bottomIcon = document.getElementById('bottom-icon');
        const bottomSymbol = document.getElementById('bottom-symbol');

        // === ETAT GLOBAL ===
        let currentTab = 'swap'; 
        let userAddress = null;
        let provider = null;
        let debounceTimer;
        let currentAmountReceivedWei = null; 
        let isEthToBpump = true; 
        let balances = { ETH: "0.00", BPUMP: "0.00", ARC_USDC: "0.00" };

        const ETH_HTML = `<img src="https://assets.coingecko.com/coins/images/279/small/ethereum.png" class="w-6 h-6 rounded-full inline" alt="ETH">`;
        const BPUMP_HTML = `🚀`;
        const USDC_HTML = `<img src="https://assets.coingecko.com/coins/images/6319/small/usdc.png" class="w-6 h-6 rounded-full inline" alt="USDC">`;

        // ==========================================
        // GESTION DES ONGLETS (NAVIGATION)
        // ==========================================
        tabSwap.addEventListener('click', () => {
            if (currentTab === 'swap') return;
            currentTab = 'swap';
            tabSwap.classList.add('tab-active');
            tabBridge.classList.remove('tab-active');
            
            panelTitle.innerText = "Megaswap";
            bridgeDestBox.classList.add('hidden');
            flipContainer.classList.remove('hidden');
            slippageBox.classList.remove('hidden');
            poweredFooter.innerHTML = "Powered by Aerodrome Liquidity • 0x17...cAd6";
            
            networkBadge.className = "bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-full px-3 py-1 text-xs font-bold flex items-center gap-1";
            networkBadgeText.innerText = "Base Mainnet";

            isEthToBpump = true;
            topIcon.innerHTML = ETH_HTML; topSymbol.innerText = "ETH";
            bottomIcon.innerHTML = BPUMP_HTML; bottomSymbol.innerText = "BPUMP";
            
            resetInputs();
            checkNetworkAndLoad();
        });

        tabBridge.addEventListener('click', () => {
            if (currentTab === 'bridge') return;
            currentTab = 'bridge';
            tabBridge.classList.add('tab-active');
            tabSwap.classList.remove('tab-active');
            
            panelTitle.innerText = "Megaswap Bridge";
            bridgeDestBox.classList.remove('hidden');
            flipContainer.classList.add('hidden'); 
            slippageBox.classList.add('hidden');   
            poweredFooter.innerHTML = "ARC Cross-Chain Protocol • Testnet Mode";
            
            networkBadge.className = "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-full px-3 py-1 text-xs font-bold flex items-center gap-1";
            networkBadgeText.innerText = "ARC Testnet";

            topIcon.innerHTML = USDC_HTML; topSymbol.innerText = "USDC";
            bottomIcon.innerHTML = USDC_HTML; bottomSymbol.innerText = "USDC";
            
            resetInputs();
            checkNetworkAndLoad();
        });

        function resetInputs() {
            topInput.value = "";
            bottomOutput.value = "";
            currentAmountReceivedWei = null;
            statusMsg.innerText = "";
            txDetails.classList.add('hidden');
            updateUI();
        }

        // ==========================================
        // CONNEXION & RÉSEAUX (AVEC AJOUT AUTOMATIQUE)
        // ==========================================
        async function initProvider() {
            if (window.ethereum) provider = new ethers.BrowserProvider(window.ethereum);
        }

        async function checkNetworkAndLoad() {
            if (!window.ethereum || !userAddress) return;
            const target = (currentTab === 'swap') ? CHAIN_BASE_MAINNET : CHAIN_ARC_TESTNET;
            
            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== target) {
                    try {
                        // 1. Tente de changer de réseau
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: target }],
                        });
                    } catch (switchError) {
                        // 2. Si le réseau n'est pas dans le MetaMask du joueur (Code 4902)
                        if (switchError.code === 4902) {
                            try {
                                if (target === CHAIN_ARC_TESTNET) {
                                    await window.ethereum.request({
                                        method: 'wallet_addEthereumChain',
                                        params: [{
                                            chainId: CHAIN_ARC_TESTNET,
                                            chainName: 'Arc Testnet',
                                            nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
                                            rpcUrls: ['https://rpc.testnet.arc.network'],
                                            blockExplorerUrls: ['https://testnet.arcscan.app']
                                        }]
                                    });
                                } else {
                                    await window.ethereum.request({
                                        method: 'wallet_addEthereumChain',
                                        params: [{
                                            chainId: CHAIN_BASE_MAINNET,
                                            chainName: 'Base',
                                            nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
                                            rpcUrls: ['https://mainnet.base.org'],
                                            blockExplorerUrls: ['https://basescan.org']
                                        }]
                                    });
                                }
                            } catch (addError) {
                                throw addError; // L'utilisateur a refusé l'ajout
                            }
                        } else {
                            throw switchError; // L'utilisateur a refusé le switch
                        }
                    }
                }
                statusMsg.style.color = "#10B981";
                statusMsg.innerText = `🟢 Connected: ${userAddress.substring(0,6)}...${userAddress.substring(38)}`;
            } catch (e) {
                console.log("Erreur de réseau:", e);
                statusMsg.style.color = "#F59E0B";
                statusMsg.innerText = `⚠️ Connected (Wrong Network for ${currentTab}).`;
            }
            await fetchBalances();
        }

        async function fetchBalances() {
            if (!userAddress || !provider) return;
            try {
                if (currentTab === 'swap') {
                    const balanceWei = await provider.getBalance(userAddress);
                    balances.ETH = parseFloat(ethers.formatEther(balanceWei)).toFixed(4);

                    const bpumpContract = new ethers.Contract(BPUMP_ADDRESS, erc20ABI, provider);
                    const bpumpWei = await bpumpContract.balanceOf(userAddress);
                    balances.BPUMP = parseFloat(ethers.formatEther(bpumpWei)).toFixed(2);
                    
                    topBalanceDisplay.innerText = isEthToBpump ? balances.ETH : balances.BPUMP;
                    // FIX : L'erreur de syntaxe était ici (remplacement de ":" par "?")
                    bottomBalanceDisplay.innerText = isEthToBpump ? balances.BPUMP : balances.ETH;
                } else {
                    topBalanceDisplay.innerText = "100.00"; 
                    bottomBalanceDisplay.innerText = "100.00";
                }
            } catch (error) {
                console.error("Balance Error:", error);
            }
        }

        // FLIP (Uniquement Swap)
        btnFlip.addEventListener('click', () => {
            if (currentTab !== 'swap') return;
            btnFlip.classList.toggle('flipped');
            isEthToBpump = !isEthToBpump;
            
            if (isEthToBpump) {
                topIcon.innerHTML = ETH_HTML; topSymbol.innerText = "ETH";
                bottomIcon.innerHTML = BPUMP_HTML; bottomSymbol.innerText = "BPUMP";
            } else {
                topIcon.innerHTML = BPUMP_HTML; topSymbol.innerText = "BPUMP";
                bottomIcon.innerHTML = ETH_HTML; bottomSymbol.innerText = "ETH";
            }
            resetInputs();
        });

        // DISCONNECT
        disconnectBtn.addEventListener('click', () => {
            userAddress = null;
            resetInputs();
            statusMsg.style.color = "#64748B";
            statusMsg.innerText = "🔌 Disconnected.";
            updateUI();
        });

        // ORACLE DE PRIX
        async function fetchPrice(amountIn) {
            if (!provider) return;
            if (currentTab === 'swap') {
                try {
                    bottomOutput.value = "Calculating...";
                    rateDisplay.innerText = "Fetching liquidity...";
                    const routerContract = new ethers.Contract(AERO_ROUTER, routerABI, provider);
                    const amountInWei = ethers.parseEther(amountIn.toString());
                    const route = isEthToBpump ? [[WETH_ADDRESS, BPUMP_ADDRESS, false, AERO_FACTORY]] : [[BPUMP_ADDRESS, WETH_ADDRESS, false, AERO_FACTORY]];

                    const amountsOut = await routerContract.getAmountsOut(amountInWei, route);
                    currentAmountReceivedWei = amountsOut[1]; 
                    bottomOutput.value = parseFloat(ethers.formatEther(currentAmountReceivedWei)).toFixed(isEthToBpump ? 2 : 4);
                    
                    const ratio = parseFloat(bottomOutput.value) / parseFloat(amountIn);
                    rateDisplay.innerText = isEthToBpump ? `1 ETH = ${ratio.toFixed(0)} BPUMP` : `1 BPUMP = ${ratio.toFixed(6)} ETH`;
                    statusMsg.style.color = "#10B981"; statusMsg.innerText = "✅ Ready to swap!";
                    updateUI();
                } catch (e) {
                    bottomOutput.value = "0.0"; statusMsg.style.color = "#EF4444"; statusMsg.innerText = "⚠️ No route.";
                }
            } else {
                bottomOutput.value = amountIn;
                rateDisplay.innerText = "1 USDC (ARC) = 1.00 USDC (Dest)";
                statusMsg.style.color = "#10B981"; statusMsg.innerText = "✅ Bridge route verified!";
            }
        }

        // SWAP / BRIDGE ACTIONS (MOTEUR COMPLET)
        async function executeAction() {
            if (currentTab === 'swap') {
                if (!provider || !currentAmountReceivedWei) return;
                try {
                    actionBtn.disabled = true;
                    const signer = await provider.getSigner();
                    const routerContract = new ethers.Contract(AERO_ROUTER, routerABI, signer);
                    const amountInWei = ethers.parseEther(topInput.value.toString());
                    const amountOutMinWei = (currentAmountReceivedWei * 95n) / 100n; // Slippage 5%
                    const deadline = Math.floor(Date.now() / 1000) + (60 * 20);

                    let tx;

                    if (isEthToBpump) {
                        statusMsg.style.color = "#38BDF8";
                        statusMsg.innerText = "Please confirm the ETH transaction...";
                        actionBtn.innerText = "⏳ Confirming...";
                        
                        const route = [[WETH_ADDRESS, BPUMP_ADDRESS, false, AERO_FACTORY]];
                        tx = await routerContract.swapExactETHForTokens(
                            amountOutMinWei, route, userAddress, deadline, { value: amountInWei }
                        );
                    } else {
                        const bpumpContract = new ethers.Contract(BPUMP_ADDRESS, erc20ABI, signer);
                        const allowance = await bpumpContract.allowance(userAddress, AERO_ROUTER);

                        if (allowance < amountInWei) {
                            statusMsg.style.color = "#F59E0B";
                            statusMsg.innerText = "Step 1/2: Approve BPUMP for trading...";
                            actionBtn.innerText = "⏳ Approving...";
                            
                            const txApprove = await bpumpContract.approve(AERO_ROUTER, ethers.MaxUint256);
                            await txApprove.wait();
                        }

                        statusMsg.style.color = "#38BDF8";
                        statusMsg.innerText = "Step 2/2: Confirming the Swap...";
                        actionBtn.innerText = "⏳ Swapping...";
                        
                        const route = [[BPUMP_ADDRESS, WETH_ADDRESS, false, AERO_FACTORY]];
                        tx = await routerContract.swapExactTokensForETH(
                            amountInWei, amountOutMinWei, route, userAddress, deadline
                        );
                    }

                    statusMsg.innerText = "⏳ Swapping on Base Mainnet...";
                    await tx.wait(); 

                    statusMsg.style.color = "#10B981";
                    statusMsg.innerText = "🎉 Swap Successful!";
                    topInput.value = ""; bottomOutput.value = "";
                    
                    await fetchBalances(); 
                    updateUI();
                    
                } catch (error) {
                    console.error("Swap Error:", error);
                    statusMsg.style.color = "#EF4444";
                    if(error.code === "ACTION_REJECTED") statusMsg.innerText = "❌ Transaction cancelled by user.";
                    else statusMsg.innerText = "❌ Swap failed (Price impact too high?)";
                } finally {
                    actionBtn.disabled = false;
                    updateUI();
                }
            } else {
                statusMsg.style.color = "#38BDF8";
                statusMsg.innerText = "⚡ Initializing ARC cross-chain transfer...";
            }
        }

        // UI MANAGEMENT & METAMASK LISTENERS
        async function updateUI() {
            if (!userAddress) {
                disconnectBtn.classList.add('hidden');
                actionBtn.innerText = "Connect Wallet";
                actionBtn.className = "w-full bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold py-4 px-4 rounded-xl transition shadow-lg text-lg uppercase";
                return;
            }
            disconnectBtn.classList.remove('hidden');

            if (topInput.value > 0) {
                txDetails.classList.remove('hidden');
                
                if (currentTab === 'swap' && !isEthToBpump && provider) {
                    try {
                        const bpumpContract = new ethers.Contract(BPUMP_ADDRESS, erc20ABI, provider);
                        const allowance = await bpumpContract.allowance(userAddress, AERO_ROUTER);
                        const amountInWei = ethers.parseEther(topInput.value.toString());
                        
                        if (allowance < amountInWei) {
                            actionBtn.innerText = "Approve BPUMP";
                            actionBtn.className = "w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-bold py-4 px-4 rounded-xl transition shadow-lg text-lg uppercase tracking-wider";
                            return;
                        }
                    } catch(e) {}
                }

                actionBtn.innerText = (currentTab === 'swap') ? "Swap" : "Bridge Jeton";
                actionBtn.className = "w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 px-4 rounded-xl transition shadow-lg text-lg uppercase shadow-[0_0_20px_rgba(59,130,246,0.5)]";
            } else {
                actionBtn.innerText = "Enter an amount";
                actionBtn.className = "w-full bg-slate-700 text-slate-400 font-bold py-4 px-4 rounded-xl cursor-not-allowed text-lg uppercase";
            }
        }

        topInput.addEventListener('input', () => {
            updateUI();
            clearTimeout(debounceTimer);
            if (topInput.value > 0) {
                debounceTimer = setTimeout(() => { fetchPrice(topInput.value); }, 500);
            }
        });

        actionBtn.addEventListener('click', async () => {
            if (!window.ethereum) { statusMsg.innerText = "🦊 Please install MetaMask."; return; }

            if (!userAddress) {
                try {
                    actionBtn.innerText = "Connecting...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    await initProvider();
                    await checkNetworkAndLoad();
                    updateUI();
                } catch (e) {
                    statusMsg.style.color = "#EF4444";
                    statusMsg.innerText = "❌ Connection rejected.";
                    updateUI();
                }
                return;
            } else if (topInput.value > 0) {
                executeAction();
            }
        });

        window.addEventListener('load', async () => {
            await initProvider();
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) { userAddress = accounts[0]; await checkNetworkAndLoad(); updateUI(); }
            }
        });
    </script>
</body>
</html>
